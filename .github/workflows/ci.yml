name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # README "Verification" includes npm run test:browser. The always-on
      # fallback spec (load -> lint -> revise -> compare -> export, no WebMCP)
      # runs here; visual smokes stay local-only because toHaveScreenshot
      # snapshots are only stable on a pinned OS/browser (see issue #7).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser lane (fallback, no WebMCP)
        run: npx playwright test tests/browser/workbench.spec.ts --project=chromium
