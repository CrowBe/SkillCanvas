    <title>Skill Canvas</title>
    <script>
      (() => {
        const choice =
          localStorage.getItem("skill-canvas:appearance") || "system";
        const resolved =
          choice === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : choice;
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
